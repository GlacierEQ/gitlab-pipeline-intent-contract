[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "gitlab-pipeline-intent-contract"
version = "1.0.0"
description = "Content-addressed CI pipeline intent contracts and execution-plan drift verification"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
pipeline-intent-contract = "pipeline_intent_contract:cli"

[tool.setuptools]
py-modules = ["pipeline_intent_contract"]
package-dir = {"" = "src"}

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
